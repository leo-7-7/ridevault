<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Bike | RideVault</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #080808;
            color: white;
        }

        .top-bar {
            background: #111;
            border-bottom: 3px solid #e10600;
            padding: 20px 40px;
        }

        .top-bar h1 {
            margin: 0;
            color: #e10600;
            letter-spacing: 3px;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: 50px auto;
            background: #111;
            padding: 35px;
            border-top: 5px solid #e10600;
            box-shadow: 0 0 30px rgba(225, 6, 0, 0.25);
        }

        h2 {
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 7px;
            color: #aaa;
            font-size: 13px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #333;
            background: #050505;
            color: white;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #e10600;
        }

        button {
            width: 100%;
            margin-top: 30px;
            padding: 15px;
            border: none;
            background: #e10600;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            text-transform: uppercase;
        }

        button:hover {
            background: #ff120b;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #aaa;
            text-decoration: none;
        }

        .back:hover {
            color: white;
        }
    </style>
</head>

<body>

<div class="top-bar">
    <h1>RIDEVAULT</h1>
</div>

<div class="container">

    <h2>Add Machine</h2>

    <form th:action="@{/bikes/add}"
          th:object="${bike}"
          method="post">

        <label>Bike Name</label>
        <input type="text"
               th:field="*{name}"
               placeholder="Example: My R15"
               required>

        <label>Brand</label>
        <input type="text"
               th:field="*{brand}"
               placeholder="Example: Yamaha"
               required>

        <label>Model</label>
        <input type="text"
               th:field="*{model}"
               placeholder="Example: R15 V4"
               required>

        <label>Year</label>
        <input type="number"
               th:field="*{year}"
               placeholder="Example: 2024"
               min="1900"
               required>

        <label>Current Kilometer</label>
        <input type="number"
               th:field="*{currentKm}"
               placeholder="Example: 5000"
               min="0"
               step="0.1"
               required>

        <button type="submit">
            ADD BIKE
        </button>

    </form>

    <a class="back" th:href="@{/bikes}">
        ← BACK TO GARAGE
    </a>

</div>

</body>
</html>
