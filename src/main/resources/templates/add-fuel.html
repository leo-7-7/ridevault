<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Fuel | RideVault</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #080808;
            color: white;
        }

        .top-bar {
            background: #111;
            border-bottom: 3px solid #e10600;
            padding: 20px 40px;
        }

        .top-bar h1 {
            margin: 0;
            color: #e10600;
            letter-spacing: 3px;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: 50px auto;
            background: #111;
            padding: 35px;
            border-top: 5px solid #e10600;
            box-shadow: 0 0 30px rgba(225, 6, 0, 0.25);
        }

        h2 {
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 7px;
            color: #aaa;
            font-size: 13px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #333;
            background: #050505;
            color: white;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #e10600;
        }

        button {
            width: 100%;
            margin-top: 30px;
            padding: 15px;
            border: none;
            background: #e10600;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            text-transform: uppercase;
        }

        button:hover {
            background: #ff120b;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #aaa;
            text-decoration: none;
        }

        .back:hover {
            color: white;
        }
    </style>
</head>

<body>

<div class="top-bar">
    <h1>RIDEVAULT</h1>
</div>

<div class="container">

    <h2>Fuel Entry</h2>

    <div class="subtitle">
        Record your latest fuel stop
    </div>

    <form th:action="@{/fuel/add/{id}(id=${bikeId})}"
          th:object="${fuelRecord}"
          method="post">

        <label>Odometer (KM)</label>
        <input type="number"
               th:field="*{odometer}"
               placeholder="Example: 5200"
               min="0"
               step="0.1"
               required>

        <label>Fuel (Litres)</label>
        <input type="number"
               th:field="*{liters}"
               placeholder="Example: 8.5"
               min="0.01"
               step="0.01"
               required>

        <label>Fuel Cost (₹)</label>
        <input type="number"
               th:field="*{cost}"
               placeholder="Example: 850"
               min="0"
               step="0.01"
               required>

        <label>Fuel Date</label>
        <input type="date"
               th:field="*{fuelDate}"
               required>

        <button type="submit">
            SAVE FUEL RECORD
        </button>

    </form>

    <a class="back"
       th:href="@{/dashboard/{id}(id=${bikeId})}">
        ← BACK TO RACE CONTROL
    </a>

</div>

</body>
</html>
